
name: Check SQL Homework

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL homework
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -f solution/homework.sql
      - name: Run SQL tests
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -f tests/check_ddl.sql